const questions=[{"scenario": "A researcher has one average household electricity bill for each of six parishes. The aim is to compare the six parish averages, not to display the distribution of individual household bills.", "prompt": "Which display is most appropriate?", "options": ["A histogram with parish names on the horizontal axis", "A scatterplot without a second quantitative variable", "A stem and leaf plot of parish names", "A bar chart with separate bars for the six parishes"], "answer": 3, "explanation": "Parish is categorical and the average bill is quantitative. Separate bars compare the summary for each category. A histogram groups quantitative observations into numeric intervals.", "visual": "", "type": "mcq"}, {"scenario": "Ten delivery times in minutes appear in the stem and leaf display. Each leaf is one delivery.", "prompt": "What are the median and range, respectively?", "options": ["34 minutes and 29 minutes", "32 minutes and 29 minutes", "32 minutes and 50 minutes", "31 minutes and 21 minutes"], "answer": 1, "explanation": "The ordered times are 21, 24, 28, 30, 32, 32, 36, 41, 45, 50. Median = (32 + 32)/2 = 32. Range = 50 − 21 = 29.", "visual": "<div class=\"tablewrap\"><table><thead><tr><th>Stem</th><th>Leaves</th></tr></thead><tbody><tr><td>2</td><td>1 4 8</td></tr><tr><td>3</td><td>0 2 2 6</td></tr><tr><td>4</td><td>1 5</td></tr><tr><td>5</td><td>0</td></tr></tbody></table></div><p class=\"note\">Key: 2 | 1 means 21 minutes.</p>", "type": "mcq"}, {"scenario": "Most weekly household incomes in a sample are moderate, but a small number are extremely high. The distribution has a long right tail.", "prompt": "Which statement is most appropriate?", "options": ["The mean is typically above the median and is less resistant.", "The mean must equal the median because both measure centre.", "The mean is typically below the median and is more resistant.", "The median must exceed every observed income."], "answer": 0, "explanation": "Large incomes pull the mean upward. In a typical right skewed income distribution the mean exceeds the median. The median is more resistant to extreme observations.", "visual": "", "type": "mcq"}, {"scenario": "In a normal quantile plot of 160 measurements, almost all points follow a straight line. One point at the upper end lies far from that line.", "prompt": "Which conclusion is best supported?", "options": ["The main body is approximately normal, with a possible upper outlier.", "The entire distribution must be strongly uniform.", "Every observation is exactly normally distributed.", "The increasing points alone prove perfect normality."], "answer": 0, "explanation": "An approximately straight pattern supports approximate normality for the main body. A single extreme point away from that pattern may be an outlier and should be investigated.", "visual": "", "type": "mcq"}, {"scenario": "A university divides its student register into four faculties. Within each faculty, it uses a random number generator to select 30 students. Every faculty is represented.", "prompt": "Which sampling method is used?", "options": ["Cluster sampling", "Stratified random sampling", "Convenience sampling", "A census"], "answer": 1, "explanation": "Faculties are strata and a random sample is selected within every stratum. Cluster sampling would select some whole groups rather than sampling within all faculties.", "visual": "", "type": "mcq"}, {"scenario": "A bank randomly selects six of its branches and then randomly selects 12 employees within each chosen branch. Employees at unselected branches cannot enter this sample.", "prompt": "Which sampling method best describes the procedure?", "options": ["A multistage random sample", "A stratified sample with all branches represented", "A census", "A simple random sample of all employees"], "answer": 0, "explanation": "There are two sampling stages: branches first, employees second. Sampling only some people within selected branches makes this multistage rather than a one stage whole cluster sample.", "visual": "", "type": "mcq"}, {"scenario": "Every registered student on a course submits a compulsory questionnaire about study habits. No registered student is omitted. Some students may still misreport their study time.", "prompt": "Which statement is correct?", "options": ["This is a census of registered course students, but response error may remain.", "This is a census of all university students.", "This is automatically a simple random sample with no possible error.", "A census guarantees truthful answers."], "answer": 0, "explanation": "All members of the stated course population are included, so it is a census of that population. Measuring everyone does not remove errors such as inaccurate self reporting.", "visual": "", "type": "mcq"}, {"scenario": "A researcher numbers all 9000 registered students and randomly selects 300 distinct numbers so that every set of 300 students has the same selection probability. Only 190 selected students respond.", "prompt": "Which statement is correct?", "options": ["The selection is simple random sampling, but nonresponse could bias the results.", "Random selection guarantees that nonresponse creates no bias.", "The 190 respondents necessarily form a census.", "The original selection is cluster sampling because students attend one university."], "answer": 0, "explanation": "The equal probability for every possible set defines simple random sampling. The responding subset may differ systematically from nonrespondents, so nonresponse remains a concern.", "visual": "", "type": "mcq"}, {"scenario": "A study records elapsed time in seconds to complete a task. Zero seconds represents no elapsed time, and a 40 second task lasts twice as long as a 20 second task.", "prompt": "What is the measurement level?", "options": ["Ordinal", "Ratio", "Nominal", "Interval"], "answer": 1, "explanation": "Elapsed duration has a meaningful zero and meaningful ratios. It therefore uses a ratio scale. This differs from a time of day on a clock.", "visual": "", "type": "mcq"}, {"scenario": "Temperatures are recorded in degrees Celsius. A rise from 10°C to 20°C has the same size as a rise from 20°C to 30°C, but 20°C is not twice as hot as 10°C.", "prompt": "What is the measurement level?", "options": ["Ordinal", "Ratio", "Nominal", "Interval"], "answer": 3, "explanation": "Celsius has equal, meaningful differences but an arbitrary zero. Ratios of Celsius readings are not meaningful, so the scale is interval.", "visual": "", "type": "mcq"}, {"scenario": "Students rate a service as very poor, poor, fair, good or excellent. The ordering is meaningful, but differences between adjacent ratings are not measured.", "prompt": "What is the measurement level?", "options": ["Nominal", "Ordinal", "Interval", "Ratio"], "answer": 1, "explanation": "The categories can be ranked but their spacing is not quantitatively defined. This is ordinal measurement.", "visual": "", "type": "mcq"}, {"scenario": "A boxplot of waiting times shows strong right skewness and several large outliers. The aim is to summarise typical waiting time and spread with resistant measures.", "prompt": "Which pair is most appropriate?", "options": ["Median and interquartile range", "Mean and standard deviation", "Median and standard deviation", "Mean and interquartile range"], "answer": 0, "explanation": "Both median and interquartile range resist extreme values. The mean and standard deviation can change substantially in the presence of large outliers.", "visual": "", "type": "mcq"}, {"scenario": "Weekly sales have a strongly right skewed population distribution with mean J$96000 and standard deviation J$14400. A random independent sample of 64 weeks is taken, and the central limit theorem approximation is appropriate.", "prompt": "Which describes the sampling distribution of the sample mean?", "options": ["Right skewed; mean J$96000; standard deviation J$14400", "Approximately normal; mean J$96000; standard error J$225", "Approximately normal; mean J$1500; standard error J$1800", "Approximately normal; mean J$96000; standard error J$1800"], "answer": 3, "explanation": "The sample mean is approximately normal for this sufficiently large sample under the stated conditions. Its mean is μ = 96000 and its standard error is σ/√n = 14400/8 = 1800.", "visual": "", "type": "mcq"}, {"scenario": "Customer ages are normally distributed with mean 40 years and standard deviation 12 years. A researcher samples 36 customers but asks for the probability that one randomly selected customer is older than 46.", "prompt": "Which standardisation is appropriate for this probability?", "options": ["P(Z > (46 − 36)/40)", "P(Z > (46 − 40)/(12/√36))", "P(Z > (46 − 40)/12)", "P(Z < (46 − 40)/12)"], "answer": 2, "explanation": "The event concerns one customer, not the sample mean. Use σ = 12 rather than σ/√36. The appropriate probability is P(Z > 0.5).", "visual": "", "type": "mcq"}, {"scenario": "In a large population, 36% of customers renew a service. A simple random independent sample of 400 customers is selected. Let p̂ be its renewal proportion.", "prompt": "What are the mean and standard error of p̂?", "options": ["Mean 0.36; standard error 0.480", "Mean 144; standard error 0.024", "Mean 0.36; standard error 0.024", "Mean 0.64; standard error 0.000576"], "answer": 2, "explanation": "E(p̂) = p = 0.36. SE(p̂) = √[p(1 − p)/n] = √[0.36(0.64)/400] = √0.000576 = 0.024.", "visual": "", "type": "mcq"}, {"scenario": "The population standard deviation is fixed. A researcher reduces the sample size from 225 to 25 when calculating a sample mean.", "prompt": "How does the standard error change?", "options": ["It becomes one third as large.", "It remains unchanged.", "It becomes three times as large.", "It becomes nine times as large."], "answer": 2, "explanation": "SE = σ/√n. The ratio of new to old standard error is √(225/25) = √9 = 3.", "visual": "", "type": "mcq"}, {"scenario": "Account balances are normally distributed with mean J$20000 and standard deviation J$4000. A random independent sample of 64 accounts is selected.", "prompt": "What is the probability that the sample mean exceeds J$21000, to four decimal places?", "options": ["0.4013", "0.1587", "0.0228", "0.9772"], "answer": 2, "explanation": "SE = 4000/√64 = 500. Standardise the sample mean: z = (21000 − 20000)/500 = 2. Thus P(X̄ > 21000) = P(Z > 2) ≈ 0.0228.", "visual": "", "type": "mcq"}, {"scenario": "The true renewal proportion is 0.36. An independent random sample of 400 customers is selected. Use the normal approximation to the sampling distribution of p̂ without a continuity correction.", "prompt": "Which value is closest to P(p̂ < 0.40)?", "options": ["0.0478", "0.5675", "0.9522", "0.8400"], "answer": 2, "explanation": "SE = √[0.36(0.64)/400] = 0.024. Then z = (0.40 − 0.36)/0.024 = 1.6667. Φ(1.6667) ≈ 0.9522. A table rounded to z = 1.67 gives about 0.9525, whose closest option is also 0.9522.", "visual": "", "type": "mcq"}, {"scenario": "The same sample and method are used to construct both a 90% and a 99% confidence interval for a population proportion. Neither endpoint is truncated.", "prompt": "What changes when confidence increases from 90% to 99%?", "options": ["The centre stays the same and the margin of error increases.", "The sample proportion becomes the true population proportion.", "The centre shifts upward and the interval narrows.", "The margin of error decreases because confidence is greater."], "answer": 0, "explanation": "The centre is the same sample proportion. A higher confidence level requires a larger critical value, increasing the margin of error and interval width.", "visual": "", "type": "mcq"}, {"scenario": "A planner expects a population proportion near 0.12 and wants a 99% confidence interval with margin of error at most 0.025. Use z* = 2.576 and the planning estimate 0.12.", "prompt": "What is the minimum required sample size?", "options": ["2655", "436", "1121", "1122"], "answer": 3, "explanation": "n = (z*)²p*(1 − p*)/E² = 2.576²(0.12)(0.88)/0.025² = 1121.1807. Round upward, so at least 1122 observations are needed.", "visual": "", "type": "mcq"}, {"scenario": "A manufacturer claims that 10% of units are defective. A quality manager investigates whether the true defective proportion has increased. Let p denote the population defective proportion.", "prompt": "Which hypotheses are appropriate?", "options": ["H₀: μ = 10; H₁: μ > 10", "H₀: p = 0.10; H₁: p > 0.10", "H₀: p̂ = 0.10; H₁: p̂ > 0.10", "H₀: p = 0.10; H₁: p < 0.10"], "answer": 1, "explanation": "Hypotheses refer to the population parameter p. An increase corresponds to the right sided alternative p > 0.10. The null uses the benchmark 0.10.", "visual": "", "type": "mcq"}, {"scenario": "A random sample of 600 independent units contains 78 defective units. Test H₀: p = 0.10 against H₁: p > 0.10 using the usual one proportion z test.", "prompt": "What is the test statistic, to two decimal places?", "options": ["−2.45", "0.03", "2.19", "2.45"], "answer": 3, "explanation": "p̂ = 78/600 = 0.13. Under H₀, SE₀ = √[0.10(0.90)/600] = 0.0122474. z = (0.13 − 0.10)/0.0122474 = 2.4495 ≈ 2.45. The null proportion, not p̂, belongs in the test standard error.", "visual": "", "type": "mcq"}, {"scenario": "A right sided z test has alternative H₁: p > p₀. A different sample gives an observed statistic z = −1.40.", "prompt": "What is the p value, approximately?", "options": ["0.0808", "0.4192", "0.1616", "0.9192"], "answer": 3, "explanation": "The alternative determines the tail even when the statistic is negative. The p value is P(Z ≥ −1.40) = 1 − Φ(−1.40) = 1 − 0.0808 = 0.9192.", "visual": "", "type": "mcq"}, {"scenario": "A correctly conducted hypothesis test produces a p value of 0.032. The same data, null hypothesis and alternative are used at each significance level.", "prompt": "Which decision is correct?", "options": ["Do not reject H₀ at either level.", "Reject H₀ at 1%, but do not reject at 5%.", "Reject H₀ at 5%, but do not reject at 1%.", "Reject H₀ at both 1% and 5%."], "answer": 2, "explanation": "Reject when the p value is at most α. Here 0.032 < 0.05 but 0.032 > 0.01, so the null is rejected only at the 5% level among those two levels.", "visual": "", "type": "mcq"}, {"scenario": "A test investigates whether the true defect rate exceeds 0.10. In reality the rate is 0.14, but the sample leads the researcher not to reject H₀: p = 0.10.", "prompt": "Which outcome has occurred?", "options": ["Proof that p equals 0.10", "A Type II error", "A Type I error", "A correct rejection"], "answer": 1, "explanation": "The null hypothesis is false because the true rate is 0.14. Failing to reject a false null is a Type II error.", "visual": "", "type": "mcq"}, {"scenario": "In a random sample of 800 reported scams, 432 involve elderly victims. A researcher tests whether more than half of all reported scams involve elderly victims.", "prompt": "Which identification of symbols is correct?", "options": ["p is unknown; p̂ = 432; p₀ = 0.54; n = 0.50", "p is unknown; p̂ = 0.54; p₀ = 0.50; x = 432", "p = 0.54; p̂ is unknown; p₀ = 0.50; x = 800", "p = 0.50; p̂ = 0.54; p₀ is unknown; x = 432"], "answer": 1, "explanation": "The population proportion p is unknown. The sample estimate is p̂ = 432/800 = 0.54, the null benchmark p₀ is 0.50, and the number of successes x is 432.", "visual": "", "type": "mcq"}, {"scenario": "A random sample gives a 95% confidence interval of (0.48, 0.56) for a population proportion. Use the frequentist interpretation of confidence.", "prompt": "Which statement is correct?", "options": ["95% of individual responses must lie between 0.48 and 0.56.", "The sample proportion is unknown but equals the lower endpoint.", "There is a 95% probability that the fixed population proportion moves inside this observed interval.", "In repeated sampling, about 95% of intervals produced by this procedure contain the true population proportion."], "answer": 3, "explanation": "Confidence describes the long run coverage of the interval procedure. The fixed population proportion does not move randomly between interval endpoints.", "visual": "", "type": "mcq"}, {"scenario": "A two sided test of H₀: μ = 50 has p value 0.18 at α = 0.05. The sampling assumptions are satisfied.", "prompt": "Which conclusion is justified?", "options": ["The researcher must reject H₀ because 0.18 exceeds 0.05.", "There is insufficient evidence at 5% that the population mean differs from 50.", "There is an 18% probability that H₀ is true.", "The population mean has been proved to equal 50."], "answer": 1, "explanation": "Since 0.18 > 0.05, do not reject H₀. This means insufficient evidence of a difference, not proof that the null is true and not a probability assigned to H₀.", "visual": "", "type": "mcq"}, {"scenario": "A random independent sample of 16 observations is drawn from a normal population. The population standard deviation is known to be 10 and the sample mean is 47. Test H₀: μ = 50.", "prompt": "Which test statistic is appropriate?", "options": ["t = −1.20 because population standard deviation is known", "z = −0.30 using standard deviation 10 directly", "z = −1.20 using standard error 10/√16", "t = −1.20 with 16 degrees of freedom because n is small"], "answer": 2, "explanation": "A normal population and known σ permit an exact z procedure even for n = 16. z = (47 − 50)/(10/√16) = −3/2.5 = −1.20.", "visual": "", "type": "mcq"}, {"scenario": "Daily revenue has known population standard deviation J$180. A random independent sample of 81 days gives mean revenue J$1250. Use z* = 1.96 for a 95% interval and assume the normal approximation for the sample mean is appropriate.", "prompt": "What is the 95% confidence interval for the population mean?", "options": ["(J$1210.80, J$1289.20)", "(J$1230.00, J$1270.00)", "(J$1245.64, J$1254.36)", "(J$897.20, J$1602.80)"], "answer": 0, "explanation": "SE = 180/√81 = 20. Margin of error = 1.96(20) = 39.20. The interval is 1250 ± 39.20 = (1210.80, 1289.20).", "visual": "", "type": "mcq"}, {"type": "short", "marks": 14, "scenario": "An independent random sample of 1500 eligible voters from a very large population finds that 585 support a proposed public transport initiative. There is no nonresponse. Construct a two sided 99% confidence interval for the true proportion of eligible voters who support the proposal. Use z* = 2.576. Retain unrounded intermediate values.", "prompt": "Question 31: Confidence interval investigation", "visual": "<ol class=\"subparts\"><li>State the symbol, formula and value of the point estimate at the centre. (3 marks)</li><li>State the critical value and its symbol. (2 marks)</li><li>Calculate the estimated standard error, showing formula and substitution. (3 marks)</li><li>Calculate the margin of error, showing formula and substitution. (3 marks)</li><li>Give the lower and upper limits of the 99% interval. (2 marks)</li><li>State whether the interval estimates a sample or population quantity, and identify it. (1 mark)</li></ol>", "explanation": "a) Point estimate: p̂ = x/n = 585/1500 = 0.3900. Award 1 mark each for the symbol, formula and value.\n\nb) The two sided 99% critical value is z* = 2.576. Award 1 mark each for the symbol and value.\n\nc) Estimated standard error = √[p̂(1 − p̂)/n] = √[0.39(0.61)/1500] = 0.01259365, approximately 0.0126. Award 1 mark each for formula, substitution and result.\n\nd) Margin of error = z* × SE = 2.576 × 0.01259365 = 0.03244124, approximately 0.0324. Award 1 mark each for formula, substitution and result. Keep the unrounded SE until this calculation is finished.\n\ne) Interval = p̂ ± margin of error = 0.39 ± 0.03244124 = (0.357559, 0.422441), approximately (0.3576, 0.4224). Award 1 mark per endpoint.\n\nf) This estimates the population proportion p of eligible voters supporting the proposal. Award 1 mark for identifying the population quantity. We are 99% confident that this population proportion lies between about 35.76% and 42.24%. This is not a statement that 99% of individual voters fall between two percentages.\n\nConditions: the sample is random and independent under the stated design; 585 successes and 915 failures support the normal approximation. Maximum: 14 marks."}, {"type": "short", "marks": 21, "scenario": "A firm claims that a new installation method reduces its population mean time below the old benchmark of 52 minutes. Installation times under the new method are normally distributed with known population standard deviation 7.5 minutes. An independent random sample of 25 installations has mean 48.4 minutes. Test the claim at the 1% significance level.", "prompt": "Question 32: Hypothesis testing investigation", "visual": "<ol class=\"subparts\"><li>Define the parameter and state H₀ and H₁. (4 marks)</li><li>State the test statistic symbol and formula, substitute and calculate it to two decimal places. (4 marks)</li><li>Write the general and substituted p value probability statements. (2 marks)</li><li>Describe a sketch of the null sampling distribution of the sample mean: give its centre, locate the observed sample mean and identify the p value tail. You may describe the sketch in words. (3 marks)</li><li>Calculate the p value to four decimal places. (1 mark)</li><li>Compare the p value with α and give a full contextual decision, stating whether it concerns the sample or population. (6 marks)</li><li>Does the test provide evidence that the new method reduces the population mean below 52 minutes? Answer yes or no. (1 mark)</li></ol>", "explanation": "a) Let μ be the population mean installation time under the new method, in minutes. H₀: μ = 52; H₁: μ < 52. This is a left sided test. Award 2 marks for a clear parameter definition and 1 mark for each hypothesis.\n\nb) Since the population is normal and σ is known, use z = (X̄ − μ₀)/(σ/√n). SE = 7.5/√25 = 1.5. z = (48.4 − 52)/1.5 = −2.40. Award 1 mark each for symbol, formula, substitution and statistic.\n\nc) For a left sided test, p value = P(Z ≤ z observed) = P(Z ≤ −2.40), with Z standard normal under H₀. Award 1 mark for each probability statement.\n\nd) Under H₀, the sample mean distribution is normal with centre 52 and standard error 1.5 minutes. Mark 48.4 to the left of 52 and shade all area to the left of 48.4. On a standardised axis, the centre is 0 and the observed statistic is −2.40. Award 1 mark each for centre, observed position and correct left tail.\n\ne) P(Z ≤ −2.40) = 0.5 − P(0 ≤ Z ≤ 2.40) = 0.5 − 0.4918 = 0.0082. Award 1 mark.\n\nf) The p value 0.0082 is smaller than α = 0.01, so reject H₀. At the 1% significance level, there is sufficient evidence that the population mean installation time under the new method is below 52 minutes. The inference concerns the population mean, not merely the observed sample. The 25 observed times are already summarised by their sample mean of 48.4. Award 1 mark for α, 1 for comparison, 1 for rejection, 2 for the contextual evidence statement, and 1 for identifying the population.\n\ng) Yes. Award 1 mark. Statistical evidence of a lower mean does not by itself measure the practical importance of the reduction. Maximum: 21 marks."}];

// Standalone practice exam. Work remains on this browser; no server is used.
const KEY='nlts-econ1005-final-2023-inspired-v1',DURATION=120*60*1000;
const app=document.getElementById('app'),dialog=document.getElementById('confirm');
let state=null,interval=null,storageOK=true;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const answered=(a,i)=>questions[i].type==='short'?typeof a==='string'&&a.trim().length>0:Number.isInteger(a)&&a>=0&&a<4;
function valid(s){return s&&s.version===1&&typeof s.name==='string'&&Number.isFinite(s.started)&&Number.isFinite(s.deadline)&&Number.isInteger(s.index)&&s.index>=0&&s.index<32&&Array.isArray(s.answers)&&s.answers.length===32&&s.answers.every((a,i)=>a===null||answered(a,i))&&typeof s.done==='boolean'&&(s.done||s.answers.slice(0,s.index).every(answered));}
try{const raw=localStorage.getItem(KEY);if(raw){const s=JSON.parse(raw);if(valid(s))state=s;}}catch(e){storageOK=false;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){storageOK=false;document.getElementById('storageWarning')?.classList.remove('hidden');}}
function remaining(){return Math.max(0,Math.ceil((state.deadline-Date.now())/1000));}
function intro(name='',attempt=1){app.innerHTML=`<div class="intro"><section><div class="eyebrow">ECON1005 · Final practice examination</div><h1>Final Exam<br>Mock Examination</h1><p class="muted">A complete practice session with original questions inspired by your supplied 2023 final paper.</p><div class="stats"><div class="stat"><strong>30 + 2</strong><span>MCQs and written questions</span></div><div class="stat"><strong>120</strong><span>Minutes to complete</span></div><div class="stat"><strong>65</strong><span>Total available marks</span></div></div><p><strong>No limits to what you can achieve.</strong></p><p class="muted">Section A: 30 MCQs, 30 marks.<br>Section B: two written questions, 35 marks.</p></section><section class="panel"><div class="eyebrow">Before you begin</div><h2>Your exam instructions</h2><ol class="rules"><li>Each page shows one question and its complete scenario. Questions 31 and 32 include several parts.</li><li>Select an answer or enter a written response before continuing. You cannot skip or return to earlier questions.</li><li>The two hour timer starts when you begin and continues during refreshes or time away. At zero, saved work submits automatically.</li><li>Use a scientific calculator. An offline normal table and confidence critical values are available inside the exam. Keep intermediate values unrounded.</li><li>For written questions, enter your formulas, substitutions, calculations and conclusions in the response box. Label each part a, b, c and so on. Plain text notation such as sqrt(), p hat and x bar is accepted.</li><li>Correct answers, worked solutions and marking guides appear after submission only. MCQs are automatically marked out of 30. Written responses require tutor marking out of 35; no automatic written grade is claimed.</li><li>You may repeat the exam with cleared responses and a fresh two hour timer. The same questions are used each time.</li></ol><form id="startForm"><label class="name" for="studentName">Student name</label><input id="studentName" maxlength="100" autocomplete="name" required placeholder="Enter your full name" type="text" value="${esc(name)}"><p class="error" id="nameError" role="alert"></p><button class="btn wide" type="submit">Start final mock exam →</button></form><p class="note">Work stays in this browser and is not sent to NLTS. Print or save your results before starting again.</p><p class="error ${storageOK?'hidden':''}">Browser storage is unavailable. Keep this page open.</p></section></div>`;document.getElementById('startForm').onsubmit=e=>{e.preventDefault();start(attempt);};}
function start(attempt=1){const name=document.getElementById('studentName').value.trim();if(!name){document.getElementById('nameError').textContent='Please enter your name.';return;}const t=Date.now();state={version:1,name,attempt,started:t,deadline:t+DURATION,index:0,answers:Array(32).fill(null),done:false};save();renderQuestion();runTimer();}
function renderQuestion(){if(state.done){results();return;}if(remaining()===0){finish(true);return;}const i=state.index,q=questions[i],short=q.type==='short',a=state.answers[i];
app.innerHTML=`<div class="topbar"><div><div class="eyebrow">ECON1005 · Final mock examination</div><strong>${esc(state.name)}</strong></div><div class="timer" id="timer" role="timer" aria-label="Time remaining"><small>TIME REMAINING</small><strong id="clock">120:00</strong></div></div><div class="progress" role="progressbar" aria-label="Questions completed" aria-valuemin="0" aria-valuemax="32" aria-valuenow="${i}"><span style="width:${i/32*100}%"></span></div>${NORMAL_REFERENCE}<div class="examgrid"><aside class="side"><div class="panel"><div class="eyebrow">Your progress</div><h2>${i+1} <span class="muted">/ 32</span></h2><h3>${short?'Section B · Written':'Section A · MCQ'}</h3><p>${short?q.marks+' marks for this question. Show each part clearly.':'One mark for each correct answer. No negative marking.'}</p><h3>Forward only</h3><p>Your response is locked when you continue.</p><p>Answers appear after submission.</p></div></aside><section class="panel" aria-labelledby="questionTitle"><span class="tag">Question ${i+1}${short?' · '+q.marks+' marks':' · 1 mark'}</span><div class="scenario"><div class="eyebrow">Scenario</div><p>${esc(q.scenario)}</p></div>${q.visual||''}<h2 id="questionTitle" tabindex="-1">${esc(q.prompt)}</h2>${short?`<label class="written-label" for="written">Your response and workings</label><textarea id="written" maxlength="30000" spellcheck="false" placeholder="a) ...&#10;&#10;b) ...&#10;&#10;Show formulas, substitutions and conclusions.">${esc(a||'')}</textarea><p class="note">Maximum 30000 characters. Your draft saves as you type. A nonempty response is required to continue.</p>`:`<fieldset class="options"><legend>Select one answer</legend>${q.options.map((o,j)=>`<label class="option"><input type="radio" name="answer" value="${j}" ${a===j?'checked':''}><span class="letter">${String.fromCharCode(65+j)}</span><span>${esc(o)}</span></label>`).join('')}</fieldset>`}<div class="actions"><button class="btn" id="next" ${answered(a,i)?'':'disabled'}>${i===31?'Submit exam':'Save & continue'} →</button></div><p id="storageWarning" class="error ${storageOK?'hidden':''}" role="alert">Browser storage is unavailable. Keep this page open to preserve your work.</p><p class="note">Question ${i+1} of 32 · No return to previous questions</p></section></div><p id="timeNotice" class="error" role="status"></p>`;
if(short){document.getElementById('written').oninput=e=>{if(remaining()===0){finish(true);return;}const value=e.target.value;state.answers[i]=value.trim()?value:null;save();document.getElementById('next').disabled=!answered(state.answers[i],i);};}else app.querySelectorAll('input[name=answer]').forEach(el=>el.onchange=()=>{if(remaining()===0){finish(true);return;}state.answers[i]=Number(el.value);save();document.getElementById('next').disabled=false;});
document.getElementById('next').onclick=advance;tick();}
function advance(){if(!state||state.done)return;if(!remaining()){finish(true);return;}if(!answered(state.answers[state.index],state.index))return;if(state.index===31){document.getElementById('confirmText').textContent='All 32 questions contain a response. Submit now to see your MCQ score, written responses, answer key and marking guides?';dialog.showModal();return;}state.index++;save();renderQuestion();window.scrollTo(0,0);document.getElementById('questionTitle')?.focus({preventScroll:true});}
function tick(){if(!state||state.done)return;const n=remaining();if(!n){finish(true);return;}const c=document.getElementById('clock');if(c)c.textContent=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');document.getElementById('timer')?.classList.toggle('urgent',n<=300);if(n<=300){const el=document.getElementById('timeNotice');if(el&&!el.textContent)el.textContent='Five minutes or less remain. All saved work submits automatically at zero.';}}
function runTimer(){clearInterval(interval);tick();if(!state.done)interval=setInterval(tick,250);}
function finish(timeout){if(!state||state.done)return;state.done=true;state.timedOut=!!timeout||remaining()===0;state.finished=Date.now();save();clearInterval(interval);if(dialog.open)dialog.close();results();window.scrollTo(0,0);}
function results(){const score=questions.slice(0,30).reduce((s,q,i)=>s+(state.answers[i]===q.answer?1:0),0),mcqCount=state.answers.slice(0,30).filter((a,i)=>answered(a,i)).length,writtenCount=state.answers.slice(30).filter((a,i)=>answered(a,i+30)).length;
app.innerHTML=`<section class="resulthead"><div><div class="eyebrow">Exam complete · Attempt ${state.attempt||1}</div><h1 style="font-size:34px;margin:12px 0">${esc(state.name)}, your results are ready.</h1><p class="muted">${state.timedOut?'Time expired. Saved work was submitted automatically.':'Your exam has been submitted.'}</p><div class="grade-message">${score===30?'Perfect MCQ score. Excellent work.':score>=24?'Strong MCQ performance. Review your workings next.':'Review the explanations and practise again.'}</div><p class="muted">${mcqCount}/30 MCQs answered · ${writtenCount}/2 written responses entered</p></div><div><div class="score">${score}<span style="font-size:24px;color:#bfcce4"> / 30</span></div><strong>MCQ score: ${(score/30*100).toFixed(1)}%</strong></div></section><div class="notice"><strong>Written section: awaiting tutor marking out of 35.</strong> The MCQ percentage above is not your total exam grade. Your full responses, model answers and marking guides appear below. After your tutor awards the written marks, add them to ${score} to obtain your total out of 65.</div><div class="result-buttons"><button class="btn" id="retry">Try again</button><button class="btn secondary printbutton" id="print">Print results / Save as PDF</button></div><p class="note">For information about tutoring sessions, telephone <a href="tel:18765692703">18765692703</a>. Print your result and written work before starting a new attempt. Results are stored only in this browser.</p><h2>Answer key and worked solutions</h2>${questions.map((q,i)=>{const a=state.answers[i];if(q.type==='short')return `<article class="review"><span class="tag">Question ${i+1} · ${q.marks} marks · Tutor marked</span><div class="scenario"><p>${esc(q.scenario)}</p></div>${q.visual}<h3>${esc(q.prompt)}</h3><h4>Your submitted response</h4><div class="saved-work">${a===null?'Not answered':esc(a)}</div><h4>Model solution and marking guide</h4><div class="worked">${esc(q.explanation)}</div></article>`;return `<article class="review"><span class="tag">Question ${i+1}</span><span class="${a===q.answer?'correct':'wrong'}" style="float:right;font-weight:700">${a===q.answer?'Correct':'0 marks'}</span><div class="scenario"><p>${esc(q.scenario)}</p></div>${q.visual||''}<h3>${esc(q.prompt)}</h3><p><strong>Your answer:</strong> ${a===null?'Not answered':String.fromCharCode(65+a)+'. '+esc(q.options[a])}</p><p class="correct"><strong>Correct answer:</strong> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</p><p><strong>Explanation:</strong> ${esc(q.explanation)}</p></article>`;}).join('')}<p class="note">Original NLTS practice questions inspired by the supplied paper. This is not an official university examination. Written model answers support tutor marking; they do not automatically grade your response.</p>`;document.getElementById('retry').onclick=retry;document.getElementById('print').onclick=()=>window.print();}
function retry(){if(!state||!state.done)return;const name=state.name,attempt=(state.attempt||1)+1;clearInterval(interval);intro(name,attempt);window.scrollTo(0,0);}
document.getElementById('cancelSubmit').onclick=()=>dialog.close();document.getElementById('confirmSubmit').onclick=()=>finish(false);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});window.addEventListener('pageshow',tick);window.addEventListener('beforeunload',e=>{if(state&&!state.done){e.preventDefault();e.returnValue='';}});
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{const s=JSON.parse(e.newValue);if(valid(s)){state=s;if(state.done){clearInterval(interval);if(dialog.open)dialog.close();results();}else{renderQuestion();runTimer();}}}catch(err){}}});
